[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunt-report"
version = "2.0.0"
description = "Turn raw scan output into submission-ready vulnerability reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.scripts]
hunt-report = "hunt_report:main"

[project.urls]
Homepage = "https://github.com/yourname/hunt-report"

[tool.setuptools.packages.find]
where = ["."]
include = ["hunt_report*"]
